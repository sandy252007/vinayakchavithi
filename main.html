<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganapathi - HTML & JavaScript</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #eeeeee;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 28px;
        }

        p {
            margin-top: 5px;
            color: #555;
        }



        canvas {
            background: white;

            border: 2px solid black;

            width: 400px;
            height: 500px;

            max-width: 90vw;
        }

        button {
            margin-top: 15px;

            padding: 12px 25px;

            background: black;
            color: white;

            border: none;

            cursor: pointer;

            font-size: 16px;
        }

        button:hover {
            background: #333;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🙏 Ganapathi 🙏</h1>

    <p>Created using HTML + JavaScript</p>

    <canvas
        id="ganapathiCanvas"
        width="800"
        height="1000">
    </canvas>

    <br>

    <button onclick="downloadImage()">
        Download Image
    </button>

</div>


<script>

const canvas =
    document.getElementById("ganapathiCanvas");

const ctx =
    canvas.getContext("2d");




ctx.strokeStyle = "black";

ctx.fillStyle = "white";

ctx.lineWidth = 5;

ctx.lineCap = "round";

ctx.lineJoin = "round";



function ellipse(x, y, width, height) {

    ctx.beginPath();

    ctx.ellipse(
        x + width / 2,
        y + height / 2,
        width / 2,
        height / 2,
        0,
        0,
        Math.PI * 2
    );

    ctx.stroke();
}


function line(points, width = 5) {

    ctx.beginPath();

    ctx.lineWidth = width;

    ctx.moveTo(
        points[0][0],
        points[0][1]
    );

    for (
        let i = 1;
        i < points.length;
        i++
    ) {

        ctx.lineTo(
            points[i][0],
            points[i][1]
        );

    }

    ctx.stroke();
}


function filledEllipse(
    x,
    y,
    width,
    height
) {

    ctx.beginPath();

    ctx.ellipse(
        x + width / 2,
        y + height / 2,
        width / 2,
        height / 2,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "black";

    ctx.fill();

    ctx.fillStyle = "white";
}

    220,
    260,
    290
);

    350,
    120,

);

    const link =
        document.createElement("a");

    link.download =

    link.href =
        canvas.toDataURL("image/png");

    link.click();
}

</script>

</body>
</html>
