            border-top: 1px solid #ddd;

function ellipse(x, y, width, height) {

    ctx.beginPath();

    ctx.ellipse(
        x + width / 2,
        y + height / 2,
        width / 2,
        height / 2,
        0,
        0,
        Math.PI * 2
    );

    ctx.stroke();
}


function line(points, width = 5) {

    ctx.beginPath();

    ctx.lineWidth = width;

    ctx.moveTo(
        points[0][0],
        points[0][1]
    );

    for (
        let i = 1;
        i < points.length;
        i++
    ) {

        ctx.lineTo(
            points[i][0],
            points[i][1]
        );

    }

    ctx.stroke();
}


function filledEllipse(
    x,
    y,
    width,
    height
) {

    ctx.beginPath();

    ctx.ellipse(
        x + width / 2,
        y + height / 2,
        width / 2,
        height / 2,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "black";

    ctx.fill();

    ctx.fillStyle = "white";
}

function getBotResponse(userQuestion) {
    const question = userQuestion.toLowerCase();
    
    // Check for greetings
    if (question.includes("hello") || question.includes("hi") || question.includes("hey")) {
        return "Hello! 🙏 How can I help you learn about Lord Ganapathi today?";
    }
    
    if (question.includes("thank")) {
        return "You're welcome! May Lord Ganesha bless you! 🙏";
    }
    
    if (question.includes("bye") || question.includes("goodbye")) {
        return "Goodbye! Ganpati Bappa Morya! 🙏 Come back anytime!";
    }
    
    // Search through FAQ database
    let bestMatch = null;
    let bestScore = 0;
    
    for (const faq of faqDatabase) {
        let score = 0;
        
        // Check if any keyword matches
        for (const keyword of faq.keywords) {
            if (question.includes(keyword)) {
                score += 2;
            }
        }
        
        // Check if question words match
        for (const word of faq.question.toLowerCase().split(" ")) {
            if (word.length > 3 && question.includes(word)) {
                score += 1;
            }
        }
        
        if (score > bestScore) {
            bestScore = score;
            bestMatch = faq;
        }
    }
    
    if (bestScore > 0) {
        return bestMatch.answer;
    }
    
    return "I'm not sure about that specific question. Try asking about Vinayaka Chavithi, Lord Ganesha's symbolism, mantras, celebrations, or how this artwork was created! 🙏";
}

function toggleChatbot() {
    const chatWindow = document.getElementById("chatbotWindow");
    chatWindow.classList.toggle("active");
    
    if (chatWindow.classList.contains("active")) {
        setTimeout(() => {
            document.getElementById("userInput").focus();
        }, 300);
    }
}

function addMessage(text, isUser = false) {
    const messagesContainer = document.getElementById("chatMessages");
    const messageDiv = document.createElement("div");
    messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
    messageDiv.textContent = text;
    messagesContainer.appendChild(messageDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById("userInput");
    const userText = input.value.trim();
    
    if (!userText) return;
    
    addMessage(userText, true);
    input.value = "";
    
    // Simulate bot response delay
    setTimeout(() => {
        const botResponse = getBotResponse(userText);
        addMessage(botResponse, false);
    }, 500);
}

function askQuestion(question) {
    const input = document.getElementById("userInput");
    input.value = question;
    sendMessage();
}

function handleKeyPress(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}
